name: Sync SkillRack Data

on:
  schedule:
    - cron: '0 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Scrape latest SkillRack stats
        run: node scripts/sync-skillrack.cjs

      - name: Commit and push changes if updated
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add src/data/sampleData.js public/skillrack-data.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-sync SkillRack points [skip ci]" && git push)
